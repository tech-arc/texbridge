<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist - Refashioned Clothes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    
    /* Header Styles */
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Wishlist Grid */
    .wishlist-grid {
      display: grid;
      /* Adjusted min-width slightly to ensure they don't get too squashed */
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding-bottom: 40px;
      width: 100%;
    }

    /* Product Card - COMPACT VERSION */
    .w-card {
      background: white;
      border-radius: 10px; /* Slightly tighter radius */
      overflow: hidden;
      border: 1px solid #eee;
      transition: all 0.3s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      transform: translateZ(0);
    }

    .w-card:hover {
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      transform: translateY(-4px);
    }

    .w-img-container {
      position: relative;
      /* Reduced to 80% for a shorter, landscape-oriented image area */
      padding-top: 80%; 
      overflow: hidden;
      background: #f0f0f0;
      width: 100%;
      flex-shrink: 0;
    }

    .w-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .w-card:hover .w-img {
      transform: scale(1.05);
    }

    .remove-btn {
      position: absolute;
      top: 8px; /* Tighter positioning */
      right: 8px;
      background: white;
      border-radius: 50%;
      width: 28px; /* Smaller button */
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.2s;
      z-index: 10;
      border: none;
      color: #999;
    }

    .remove-btn:hover {
      background: #fee2e2;
      color: #ef4444;
      transform: scale(1.1);
    }

    .remove-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Compact Details Section */
    .w-details {
      padding: 12px; /* Reduced padding */
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
    }

    .w-title {
      font-size: 15px; /* Slightly smaller text */
      font-weight: 600;
      margin-bottom: 4px; /* Reduced margin */
      color: #1f2937;
      display: -webkit-box;
      -webkit-line-clamp: 1; /* Limit to 1 line for compactness */
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      line-height: 1.3;
    }

    .w-price {
      font-size: 15px;
      font-weight: 700;
      color: #4a69bd;
      margin-bottom: 10px; /* Reduced margin */
    }

    .move-btn {
      width: 100%;
      padding: 8px; /* Reduced padding */
      background: #fff;
      border: 1px solid #4a69bd;
      color: #4a69bd;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px; /* Smaller font */
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .move-btn:hover {
      background: #4a69bd;
      color: white;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      display: none;
    }

    .empty-state.visible {
      display: block;
    }

    .btn-primary {
      background-color: #4a69bd;
      color: white;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin-top: 20px;
      transition: background 0.3s;
    }
    
    .btn-primary:hover {
      background-color: #3a59ad;
    }

    /* Mobile Tweaks */
    @media (max-width: 640px) {
      .wishlist-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .w-details {
        padding: 10px;
      }
      .move-btn {
        font-size: 11px;
        padding: 6px;
      }
      .w-title {
        font-size: 13px;
      }
      .w-price {
        font-size: 14px;
        margin-bottom: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-content">
      <a href="refashioned.html" class="flex items-center gap-2 text-gray-700 hover:text-blue-600 transition">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span class="font-medium hidden sm:inline">Back to Shop</span>
      </a>
      
      <div class="font-playfair text-xl font-bold text-[#4a69bd]">My Wishlist</div>

      <a href="cart.html" class="relative p-2 rounded-full hover:bg-blue-50 transition">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        <span id="headerCartBadge" class="absolute top-0 right-0 bg-[#4a69bd] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">0</span>
      </a>
    </div>
  </div>

  <div class="max-w-[1400px] mx-auto px-6 py-8">
    
    <div class="mb-6 text-gray-500 font-medium" id="itemCountDisplay">
      0 Items
    </div>

    <div id="wishlistGrid" class="wishlist-grid">
      </div>

    <div id="emptyState" class="empty-state">
      <svg class="w-32 h-32 mx-auto text-gray-200 mb-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
      </svg>
      <h2 class="text-2xl font-bold text-gray-800 mb-2 font-playfair">Your wishlist is empty</h2>
      <p class="text-gray-500 mb-6">Save items you love here for later!</p>
      <a href="refashioned.html" class="btn-primary">Start Shopping</a>
    </div>

  </div>

  <script src="cart-manager.js"></script>
  <script src="wishlist-manager.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderWishlist();
      updateCartBadge();
    });

    function renderWishlist() {
      const list = window.wishlistManager.getWishlist();
      const grid = document.getElementById('wishlistGrid');
      const emptyState = document.getElementById('emptyState');
      const countDisplay = document.getElementById('itemCountDisplay');

      grid.innerHTML = '';

      if (list.length === 0) {
        emptyState.classList.add('visible');
        countDisplay.style.display = 'none';
        return;
      }

      emptyState.classList.remove('visible');
      countDisplay.style.display = 'block';
      countDisplay.textContent = `${list.length} Item${list.length !== 1 ? 's' : ''}`;

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'w-card';
        card.innerHTML = `
          <div class="w-img-container">
            <img src="${item.image}" alt="${item.title}" class="w-img">
            <button class="remove-btn" onclick="removeFromWishlist('${item.id}')" title="Remove">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div class="w-details">
            <div>
              <h3 class="w-title" title="${item.title}">${item.title}</h3>
              <div class="w-price">${item.price}</div>
            </div>
            <button class="move-btn" onclick="moveToCart('${item.id}')">Move to Cart</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function removeFromWishlist(id) {
      window.wishlistManager.removeItem(id);
      renderWishlist();
    }

    function moveToCart(id) {
      const list = window.wishlistManager.getWishlist();
      const item = list.find(i => i.id === id);

      if (item) {
        // Construct cart item (Default size 'M' if not specified, quantity 1)
        const cartItem = {
          id: item.id,
          title: item.title,
          price: item.price,
          image: item.image,
          size: item.hasSizes ? 'M' : 'N/A', // Use 'N/A' for items without sizes
          brand: item.brand || 'Refashioned',
          quantity: 1
        };

        // Add to Cart
        window.cartManager.addItem(cartItem);
        
        // Remove from Wishlist
        window.wishlistManager.removeItem(id);
        
        // Refresh UI
        renderWishlist();
        updateCartBadge();
        
        // Optional Feedback
        alert('Moved to Cart!');
      }
    }

    function updateCartBadge() {
        if(window.cartManager) {
            const count = window.cartManager.getItemCount();
            const badge = document.getElementById('headerCartBadge');
            badge.textContent = count;
            badge.classList.toggle('hidden', count === 0);
        }
    }
  </script>
</body>
</html>
